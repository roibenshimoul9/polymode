<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1628"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="cubeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sideFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="cubeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2563eb" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="220" fill="url(#cubeGlow)"/>
  
  <g transform="translate(256, 240) scale(4.4) translate(-50, -50)" filter="url(#cubeShadow)">
    <path d="M50 15 L85 30 L50 45 L15 30 Z" fill="url(#topFace)" opacity="0.98"/>
    <path d="M50 45 L85 30 L85 70 L50 85 Z" fill="url(#sideFace)"/>
    <path d="M15 30 L50 45 L50 85 L15 70 Z" fill="url(#frontFace)"/>
    <text x="32.5" y="58" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" text-anchor="middle" transform="skewY(20)">P</text>
    <text x="67.5" y="92" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" text-anchor="middle" transform="skewY(-20)">M</text>
